name: Sync Brightspace tutorials

on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-brightspace-tutorials
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-directory.txt

      - name: Install scraper dependencies
        run: python -m pip install -r scripts/requirements-directory.txt

      - name: Test Brightspace discovery
        run: python -m unittest tests.test_sync_brightspace_tutorials -v

      - name: Refresh Brightspace content
        run: python scripts/sync_brightspace_tutorials.py

      - name: Commit changes
        run: |
          if git diff --quiet -- Pages/BrightSpace.html docs/brightspace_tutorials.json; then
            echo "Brightspace tutorials are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Pages/BrightSpace.html docs/brightspace_tutorials.json
          git commit -m "chore: sync Brightspace tutorials"
          git push
