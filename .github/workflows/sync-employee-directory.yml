name: Sync employee directory

on:
  schedule:
    # 10:15 UTC is 5:15/6:15 a.m. Eastern, depending on daylight saving time.
    - cron: "15 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-employee-directory
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-directory.txt

      - name: Install scraper dependencies
        run: python -m pip install -r scripts/requirements-directory.txt

      - name: Refresh directory CSV
        run: python scripts/scrape_directory.py

      - name: Commit changes
        run: |
          if git diff --quiet -- docs/employee_directory.csv; then
            echo "Employee directory is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/employee_directory.csv
          git commit -m "chore: sync employee directory"
          git push
